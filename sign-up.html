<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PropertyPal - Sign Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/css/style.css" />

    <style type="text/tailwindcss">
      @theme {
        --font-*: initial;
        --font-sans: Inter, ui-sans-serif, system-ui, sans-serif;

        --color-primary-25:  #EDF5FF;
        --color-primary-50:  #d0d6f7;
        --color-primary-100: #b3bff0;
        --color-primary-200: #8fa3e6;
        --color-primary-300: #6b85d9;
        --color-primary-400: #4969d0;
        --color-primary-500: #1E40AF; /* main color */
        --color-primary-600: #193592;
        --color-primary-700: #152a77;
        --color-primary-800: #111f5c;
        --color-primary-900: #0c1440;
        --color-primary-950: #080a24;
      }
    </style>

    <!-- Your main JS -->
    <script defer type="module" src="/js/main.js"></script>
</head>
<body class="bg-slate-50 h-screen flex">

  <!-- Left Section -->
  <div class="bg-gradient-to-br from-slate-50 to-slate-100 relative hidden h-full w-full items-center lg:grid lg:w-1/2 overflow-hidden">
    <div class="flex flex-col items-center justify-center h-full w-full relative">
      <div class="absolute left-0 top-0 w-full max-w-[250px] xl:max-w-[450px]">
        <img src="./images/grid-01.svg" alt="grid">
      </div>
      <div class="absolute bottom-0 right-0 w-full max-w-[250px] xl:max-w-[450px] rotate-180">
        <img src="./images/grid-01.svg" alt="grid">
      </div>
      <div class="flex flex-col items-center text-center px-6 relative z-10 animate-fade-in">
        <div class="flex justify-center mb-6">
          <img src="./images/residential.png" alt="PropertyPal Logo" class="w-24 h-24">
        </div>
        <a href="#" class="text-5xl font-bold tracking-tight text-primary-600 mb-3 transition-transform duration-500 hover:scale-105">
          PropertyPal
        </a>
        <p class="text-lg md:text-xl text-slate-700 font-medium leading-relaxed">
          Modern Property Management <br class="hidden md:block">
          <span class="text-base md:text-lg font-normal text-slate-600">Made Simple & Elegant</span>
        </p>
      </div>
    </div>
  </div>

  <!-- Right Section -->
    <div class="flex w-full lg:w-1/2 justify-center bg-white shadow-lg h-screen overflow-y-auto">
    <div class="w-full max-w-md px-6 py-8" x-data="{ activeTab: 'landlord' }">
        
        <!-- Tabs -->
        <div class="flex justify-center mt-2 mb-4 bg-slate-100 rounded-full p-1">
            <button 
            @click="activeTab = 'tenant'" 
            :class="activeTab === 'tenant' ? 'bg-slate-900 text-white shadow' : 'text-slate-600 hover:text-black'" 
            class="px-5 py-2 text-sm font-medium rounded-full transition">
            I’m a Tenant
            </button>
            <button 
            @click="activeTab = 'landlord'" 
            :class="activeTab === 'landlord' ? 'bg-slate-900 text-white shadow' : 'text-slate-600 hover:text-black'" 
            class="px-5 py-2 text-sm font-medium rounded-full transition">
            I’m a Landlord
            </button>
        </div>

        <!-- Card -->
        <div class="transition pb-6">
        <h2 class="text-2xl font-semibold text-slate-900 mb-1">Create an Account</h2>
        <p class="text-sm text-slate-500 mb-4" 
            x-text="activeTab === 'tenant' ? 'Sign up as a Tenant' : 'Sign up as a Landlord'">
        </p>

        <div class="space-y-4">
            <!-- Full Name -->
            <div>
                <label class="block text-sm text-slate-600 mb-1">Full Name</label>
                <input 
                type="text" 
                placeholder="Enter your full name"
                class="w-full h-10 rounded-lg border border-slate-300 px-3 focus:ring-2 focus:ring-primary-500 outline-none">
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm text-slate-600 mb-1">Email Address</label>
                <input 
                type="email" 
                placeholder="Enter your email"
                class="w-full h-10 rounded-lg border border-slate-300 px-3 focus:ring-2 focus:ring-primary-500 outline-none">
            </div>

            <!-- Mobile with Country Code -->
            <div>
                <label class="block text-sm text-slate-600 mb-1">Mobile Number</label>
                <div class="flex gap-2">
                    <select 
                    class="w-24 h-10 rounded-lg border border-slate-300 px-2 focus:ring-2 focus:ring-primary-500 outline-none">
                    <option value="+91">🇮🇳 +91</option>
                    <option value="+1">🇺🇸 +1</option>
                    <option value="+44">🇬🇧 +44</option>
                    <option value="+61">🇦🇺 +61</option>
                    <option value="+971">🇦🇪 +971</option>
                    </select>
                    <input 
                type="tel" 
                placeholder="9876543210"
                    class="flex-1 h-10 rounded-lg border border-slate-300 px-3 focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm text-slate-600 mb-1">Password</label>
                <input 
                id="password" 
                type="password" 
                placeholder="Enter your password"
                class="w-full h-10 rounded-lg border border-slate-300 px-3 focus:ring-2 focus:ring-primary-500 outline-none">
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-sm text-slate-600 mb-1">Confirm Password</label>
                <input 
                type="password" 
                placeholder="Re-enter your password"
                class="w-full h-10 rounded-lg border border-slate-300 px-3 focus:ring-2 focus:ring-primary-500 outline-none">
            </div>


            <!-- Submit Button -->
            <button onclick="window.location.href='dashboard.html'"
            class="w-full h-10 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 transition">
            Sign Up
            </button>
        </div>

        <!-- Google Sign Up -->
        <div class="mt-6">
            <button 
            class="w-full h-10 flex items-center justify-center gap-3 border border-slate-300 rounded-lg font-medium text-slate-700 bg-white hover:bg-slate-50 transition">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
            Continue with Google
            </button>
        </div>

        <!-- Login link -->
        <p class="mt-6 text-center text-sm text-slate-600">
            Already have an account? <a href="/" class="text-primary-600 hover:underline">Login Here</a>
        </p>
        <p class="mt-2 text-center text-xs text-slate-400">
            By continuing, you agree to our <a href="#" class="underline">Terms of Service</a> and <a href="#" class="underline">Privacy Policy</a>
        </p>
        </div>
    </div>
    </div>


  <script>
    
    function togglePassword() {
      const input = document.getElementById("password");
      const eyeOpen = document.getElementById("eyeOpen");
      const eyeClosed = document.getElementById("eyeClosed");
      if (input.type === "password") {
        input.type = "text";
        eyeOpen.classList.add("hidden");
        eyeClosed.classList.remove("hidden");
      } else {
        input.type = "password";
        eyeClosed.classList.add("hidden");
        eyeOpen.classList.remove("hidden");
      }
    }
  </script>
</body>
</html>
