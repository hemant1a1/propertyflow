<div 
                x-show="selectedAddUnit" 
                x-cloak 
                @keydown.enter.stop 
                @keydown.window.escape="selectedAddUnit = null" 
                class="fixed inset-0 bg-black/60 z-[9999] flex justify-end"
                @click.self="selectedAddUnit = null"
                style="display: none;"
              >
                <div
                  x-show="selectedProperty"
                  x-transition:enter="transform transition ease-in-out duration-300"
                  x-transition:enter-start="translate-x-full opacity-0"
                  x-transition:enter-end="translate-x-0 opacity-100"
                  x-transition:leave="transform transition ease-in-out duration-200"
                  x-transition:leave-start="translate-x-0 opacity-100"
                  x-transition:leave-end="translate-x-full opacity-0"
                  class="bg-white w-full max-w-2xl h-full overflow-y-auto"
                >
                  <!-- Header -->
                  <div class="flex justify-between items-center border-b px-6 py-4 sticky top-0 bg-white z-10">
                    <div class="flex items-center gap-3">
                      <button @click="selectedAddUnit = null" class="text-slate-600 hover:text-primary-600">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                      </button>
                      <div>
                        <h2 class="text-lg font-semibold">Add New Unit</h2>
                      </div>
                    </div>
                    <button @click="selectedAddUnit = null" class="text-slate-500 hover:text-red-500">✕</button>
                  </div>
                  
                  <!-- Form -->
                  <form class="p-6 space-y-4">
                    <!-- Unit Name -->
                    <div>
                      <label class="block text-sm font-medium">Unit Name <span class="text-red-500">*</span>
                      </label>
                      <input type="text" placeholder="Unit name" class="w-full border rounded-lg px-3 py-2 focus:ring focus:ring-blue-200 outline-none">
                    </div>
                    <!-- Bedroom & Bathroom -->
                    <div class="grid grid-cols-2 gap-4">
                      <div>
                        <label class="block text-sm font-medium">Bedroom</label>
                        <select class="w-full border rounded-lg px-3 py-2 text-gray-500">
                          <option>Choose</option>
                          <option>1</option>
                          <option>2</option>
                          <option>3</option>
                        </select>
                      </div>
                      <div>
                        <label class="block text-sm font-medium">Bathroom</label>
                        <select class="w-full border rounded-lg px-3 py-2 text-gray-500">
                          <option>Choose</option>
                          <option>1</option>
                          <option>2</option>
                          <option>3</option>
                        </select>
                      </div>
                    </div>
                    <!-- Unit Area -->
                    <div>
                      <label class="block text-sm font-medium">Unit Area (sq. ft.)</label>
                      <input type="text" placeholder="Enter unit size" class="w-full border rounded-lg px-3 py-2 focus:ring focus:ring-blue-200 outline-none">
                    </div>
                    <!-- Monthly Rent -->
                    <div>
                      <label class="block text-sm font-medium">Monthly Rent <span class="text-red-500">*</span>
                      </label>
                      <input type="text" placeholder="Enter rent" class="w-full border rounded-lg px-3 py-2 focus:ring focus:ring-blue-200 outline-none">
                    </div>
                    <!-- Upload Documents -->
                    <div >
                      <label class="block text-sm font-medium">Upload Documents</label>
                      <div class="flex w-full">
                        <button type="button" class="bg-blue-600 text-white px-4 py-2 rounded-l-lg">Upload</button>
                        <span class="w-full flex items-center border rounded-r-lg px-3 py-2 text-gray-500 text-sm">multiple documents</span>
                      </div>
                    </div>
                    <!-- Notes -->
                    <div>
                      <label class="block text-sm font-medium">Note</label>
                      <textarea placeholder="Additional notes..." class="w-full border rounded-lg px-3 py-2 focus:ring focus:ring-blue-200 outline-none"></textarea>
                    </div>
                    <!-- Buttons -->
                    <div class="flex justify-between pt-2">
                      <button type="button" @click="open = false" class="px-6 py-2 rounded-lg border text-blue-600">Cancel</button>
                      <button type="submit" class="px-6 py-2 rounded-lg bg-blue-600 text-white">Create Unit</button>
                    </div>
                  </form>
                </div>
              </div>
