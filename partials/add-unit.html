<div 
  x-show="selectedAddUnit" 
  x-cloak 
  @keydown.enter.stop 
  @keydown.window.escape="selectedAddUnit = null" 
  class="fixed inset-0 z-[9999] flex justify-end"
  style="display: none;"
>
  <div
    x-show="selectedProperty"
    x-transition:enter="transform transition ease-in-out duration-300"
    x-transition:enter-start="translate-x-full opacity-0"
    x-transition:enter-end="translate-x-0 opacity-100"
    x-transition:leave="transform transition ease-in-out duration-200"
    x-transition:leave-start="translate-x-0 opacity-100"
    x-transition:leave-end="translate-x-full opacity-0"
    class="bg-white w-full max-w-2xl h-full overflow-y-auto"
  >
    <!-- Header -->
    <div class="flex justify-between items-center border-b px-6 py-4 sticky top-0 bg-white z-10">
      <div class="flex items-center gap-3">
        <button @click="selectedAddUnit = null" class="text-slate-600 hover:text-primary-600">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <div>
          <h2 class="text-lg font-semibold">Add New Unit</h2>
        </div>
      </div>
      <button @click="selectedAddUnit = null" class="text-slate-500 hover:text-red-500">✕</button>
    </div>

    <!-- Form -->
    <form class="p-6 space-y-4 text-sm">
      
      <!-- Unit Name -->
      <div>
        <label class="block text-xs font-medium text-slate-700">
          Unit Name <span class="text-red-500">*</span>
        </label>
        <input 
          type="text" 
          placeholder="Unit name" 
          class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 focus:ring focus:ring-primary-200 focus:border-primary-500 outline-none text-sm"
        >
      </div>

      <!-- Bedroom & Bathroom -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-700">Bedroom</label>
          <select 
            class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm text-slate-600 focus:ring focus:ring-primary-200 focus:border-primary-500 outline-none"
          >
            <option>Choose</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700">Bathroom</label>
          <select 
            class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm text-slate-600 focus:ring focus:ring-primary-200 focus:border-primary-500 outline-none"
          >
            <option>Choose</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
          </select>
        </div>
      </div>

      <!-- Unit Area -->
      <div>
        <label class="block text-xs font-medium text-slate-700">Unit Area (sq. ft.)</label>
        <input 
          type="text" 
          placeholder="Enter unit size" 
          class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:ring focus:ring-primary-200 focus:border-primary-500 outline-none"
        >
      </div>

      <!-- Monthly Rent -->
      <div>
        <label class="block text-xs font-medium text-slate-700">
          Monthly Rent <span class="text-red-500">*</span>
        </label>
        <input 
          type="text" 
          placeholder="Enter rent" 
          class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:ring focus:ring-primary-200 focus:border-primary-500 outline-none"
        >
      </div>

      <!-- Upload Documents -->
      <div>
        <label class="block text-xs font-medium text-slate-700">Upload Documents</label>
        <div class="mt-1 flex items-center w-full border border-slate-300 rounded-md overflow-hidden focus-within:ring-1 focus-within:ring-primary-500">
          <!-- Upload Button -->
          <button 
            type="button" 
            @click="openDocPanel = true" 
            class="flex items-center gap-2 px-3 py-2 bg-primary-600 text-white text-xs hover:bg-primary-700 transition"
          >
            <span>Upload</span>
          </button>

          <!-- Placeholder / Selected Doc -->
          <div class="flex-1 px-3 py-2 text-xs text-slate-500">
            No documents uploaded
          </div>
        </div>
      </div>

      <!-- Notes -->
      <div>
        <label class="block text-xs font-medium text-slate-700">Note</label>
        <textarea 
          rows="2" 
          placeholder="Additional notes..." 
          class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:ring focus:ring-primary-200 focus:border-primary-500 outline-none"
        ></textarea>
      </div>

      <!-- Buttons -->
      <div class="flex justify-between items-center pt-2">
        <button 
          type="button" 
          @click="selectedAddUnit = null" 
          class="px-4 py-1.5 border border-slate-300 rounded-md text-slate-700 text-sm hover:bg-slate-50"
        >
          Cancel
        </button>
        <button 
          type="submit" 
          class="px-4 py-1.5 bg-primary-600 text-white text-sm rounded-md hover:bg-primary-700"
        >
          Create Unit
        </button>
      </div>
    </form>
  </div>
</div>
