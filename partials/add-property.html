<div 
    x-data="{ open: false, preview: null }" 
    @keydown.escape.window="open = false"
    >
    <!-- Trigger Button -->
    <button @click="open = true" class="flex items-center gap-2 text-white px-4 py-2 text-sm rounded-lg bg-primary-600 hover:bg-primary-800 transition-colors">
        <i data-lucide="plus" class="w-5 h-5"></i>
        <span>Add Property</span>
    </button>
    <!-- Modal -->
    <div 
        x-show="open" 
        x-cloak 
        class="fixed inset-0 z-[9999] flex justify-end bg-black/50"
        x-transition.opacity
        style="display: none;"
    >
        <div 
        x-show="open"
        @click.outside="open = false"
        class="bg-white w-full max-w-lg h-full overflow-y-auto relative transform transition-all duration-300 ease-in-out"
        x-transition:enter="transform transition ease-in-out duration-300"
        x-transition:enter-start="translate-x-full"
        x-transition:enter-end="translate-x-0"
        x-transition:leave="transform transition ease-in-out duration-300"
        x-transition:leave-start="translate-x-0"
        x-transition:leave-end="translate-x-full"
        >
        <!-- Header -->
        <div class="flex justify-between items-center border-b px-6 py-4 sticky top-0 bg-white z-10">
            <h2 class="text-base font-semibold flex items-center gap-2">
            <i data-lucide="building" class="w-5 h-5 text-primary-600"></i> Add New Property
            </h2>
            <button @click="open = false" class="text-slate-500 hover:text-red-600">
            <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <!-- Form -->
        <form class="p-6 space-y-3 text-sm">
            <!-- Upload Image -->
            <div>
            <label class="block text-xs font-medium text-slate-700">Property Image</label>
            <div class="mt-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-lg p-3 cursor-pointer hover:bg-slate-50">
                <input type="file" class="hidden" id="propertyImage" accept="image/*" @change="preview = URL.createObjectURL($event.target.files[0])">
                <label for="propertyImage" class="text-xs text-slate-500 cursor-pointer text-center">
                <i data-lucide="upload" class="mx-auto w-6 h-6 text-slate-400"></i>
                <span class="block mt-1">Click to upload</span>
                <span class="block text-[11px] text-slate-400">PNG, JPG up to 10MB</span>
                </label>
                <template x-if="preview">
                <img :src="preview" alt="Preview" class="mt-2 w-20 h-20 object-cover rounded-md border">
                </template>
            </div>
            </div>
            <!-- Property Name -->
            <div>
            <label class="block text-xs font-medium text-slate-700">Property Name <span class="text-red-500">*</span>
            </label>
            <input type="text" placeholder="Apartments" class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:ring focus:ring-primary-200 focus:border-primary-500">
            </div>
            <!-- Address -->
            <div>
            <label class="block text-xs font-medium text-slate-700">Address <span class="text-red-500">*</span>
            </label>
            <input type="text" placeholder="Enter full address" class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:ring focus:ring-primary-200 focus:border-primary-500">
            </div>
            <!-- Status & Units (side by side desktop) -->
            <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-medium text-slate-700">Status</label>
                <select class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:ring focus:ring-primary-200 focus:border-primary-500">
                <option>Available</option>
                <option>Rented</option>
                <option>Sold</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-700">Total Units</label>
                <input type="number" placeholder="e.g. 12" class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:ring focus:ring-primary-200 focus:border-primary-500">
            </div>
            </div>
            <!-- Upload Documents -->
            <div>
            <label class="block text-xs font-medium text-slate-700">Upload Documents <span class="text-red-500">*</span>
            </label>
            <div class="flex gap-2 mt-1">
                <button type="button" class="px-3 py-1.5 bg-primary-600 text-white text-xs rounded-md">Upload</button>
                <input type="text" placeholder="multiple documents" class="flex-1 rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:ring focus:ring-primary-200 focus:border-primary-500">
            </div>
            </div>
            <!-- Notes -->
            <div>
            <label class="block text-xs font-medium text-slate-700">Notes</label>
            <textarea rows="2" placeholder="Additional details..." class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:ring focus:ring-primary-200 focus:border-primary-500"></textarea>
            </div>
            <!-- Actions -->
            <div class="flex justify-between items-center pt-2">
            <button type="button" @click="open = false" class="px-4 py-1.5 border border-slate-300 rounded-md text-slate-700 text-sm hover:bg-slate-50">Cancel</button>
            <button type="submit" class="px-4 py-1.5 bg-primary-600 text-white text-sm rounded-md hover:bg-primary-700">Add Property</button>
            </div>
        </form>
        </div>
    </div>
</div>
