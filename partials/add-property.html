<div 
  x-data="{ open: false, openDocPanel: false, preview: null, uploadedDocs: [], docName: '', docFile: null }"
  @keydown.escape.window="if (openDocPanel) openDocPanel = false; else open = false"
>
  <!-- Trigger Button -->
  <button 
    @click="open = true" 
    class="flex items-center gap-2 text-white px-4 py-2 text-sm rounded-lg bg-primary-600 hover:bg-primary-800 transition-colors"
  >
    <i data-lucide="plus" class="w-5 h-5"></i>
    <span>Add Property</span>
  </button>

  <!-- Main Property Modal -->
  <div 
    x-show="open" 
    x-cloak 
    class="fixed inset-0 z-[999] flex justify-end bg-black/50 backdrop-blur-sm"
    x-transition.opacity
  >
    <div 
        @click.outside.stop
        x-transition:enter="transform transition ease-in-out duration-300"
        x-transition:enter-start="translate-x-full opacity-0"
        x-transition:enter-end="translate-x-0 opacity-100"
        x-transition:leave="transform transition ease-in-out duration-200"
        x-transition:leave-start="translate-x-0 opacity-100"
        x-transition:leave-end="translate-x-full opacity-0"
        class="bg-white w-full max-w-2xl h-full overflow-y-auto"
    >
      <!-- Header -->
       <div class="flex justify-between items-center border-b px-6 py-3 sticky top-0 bg-white z-10">
            <div class="flex items-center gap-3">
                <button @click="open = false" class="text-slate-600 hover:text-primary-600">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div>
                <h2 class="text-lg font-bold">Add Property</h2>
                <p class="text-sm text-slate-500">Manage your rental properties</p>
                </div>
            </div>
        </div>
      
        <!-- Form -->
        <form class="p-6 space-y-3 text-sm" @submit.prevent>
            
            <!-- Upload Image -->
            <div>
            <label class="block text-xs font-medium text-slate-700">Property Image</label>
            <div 
                class="mt-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-lg p-3 cursor-pointer hover:bg-slate-50"
            >
                <input 
                type="file" 
                class="hidden" 
                id="propertyImage" 
                accept="image/*" 
                @change="preview = URL.createObjectURL($event.target.files[0])"
                >
                <label for="propertyImage" class="text-xs text-slate-500 cursor-pointer text-center">
                <i data-lucide="upload" class="mx-auto w-6 h-6 text-slate-400"></i>
                <span class="block mt-1">Click to upload</span>
                <span class="block text-[11px] text-slate-400">PNG, JPG up to 10MB</span>
                </label>

                <!-- Image Preview -->
                <template x-if="preview">
                <img 
                    :src="preview" 
                    alt="Preview" 
                    class="mt-2 w-20 h-20 object-cover rounded-md border"
                >
                </template>
            </div>
            </div>

            <!-- Property Name -->
            <div>
            <label class="block text-xs font-medium text-slate-700">
                Property Name <span class="text-red-500">*</span>
            </label>
            <input 
                type="text" 
                placeholder="Apartments" 
                class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:ring focus:ring-primary-200 focus:border-primary-500"
            >
            </div>

            <!-- Address -->
            <div>
            <label class="block text-xs font-medium text-slate-700">
                Address <span class="text-red-500">*</span>
            </label>
            <input 
                type="text" 
                placeholder="Enter full address" 
                class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:ring focus:ring-primary-200 focus:border-primary-500"
            >
            </div>

            <!-- Property Type & Units -->
            <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-medium text-slate-700">Property Type</label>
                <select 
                class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:ring focus:ring-primary-200 focus:border-primary-500"
                >
                <option>House</option>
                <option>Apartment</option>
                <option>Shop</option>
                <option>Office</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-700">Total Units</label>
                <input 
                type="number" 
                placeholder="e.g. 12" 
                class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:ring focus:ring-primary-200 focus:border-primary-500"
                >
            </div>
            </div>

            <!-- Upload Documents -->
            <div>
                <label class="block text-xs font-medium text-slate-700">Upload Documents</label>
                <div @click="openDocPanel = true"  class="mt-1 flex items-center w-full border border-slate-300 rounded-md overflow-hidden focus-within:ring-1 focus-within:ring-primary-500">
                    <!-- Upload Button -->
                    <button 
                    type="button" 
                    class="flex items-center gap-2 px-3 py-2 bg-primary-600 text-white text-xs hover:bg-primary-700 transition"
                    >
                    <span>Upload</span>
                    </button>

                    <!-- Placeholder / Selected Doc -->
                    <div class="flex-1 px-3 py-2 text-xs text-slate-500" x-text="uploadedDocs.length ? uploadedDocs.map(d => d.name).join(', ') : 'No documents uploaded'"></div>
                </div>
            </div>


            <!-- Notes -->
            <div>
            <label class="block text-xs font-medium text-slate-700">Notes</label>
            <textarea 
                rows="2" 
                placeholder="Additional details..." 
                class="mt-1 w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:ring focus:ring-primary-200 focus:border-primary-500"
            ></textarea>
            </div>

            <!-- Actions -->
            <div class="flex justify-between items-center pt-2">
            <button 
                type="button" 
                @click="open = false" 
                class="px-4 py-1.5 border border-slate-300 rounded-md text-slate-700 text-sm hover:bg-slate-50"
            >
                Cancel
            </button>
            <button 
                type="submit" 
                class="px-4 py-1.5 bg-primary-600 text-white text-sm rounded-md hover:bg-primary-700"
            >
                Add Property
            </button>
            </div>
        </form>
    </div>
  </div>


    <!-- Upload Documents (Overlay on top of Add Property) -->
    <div 
    x-show="openDocPanel" 
    x-cloak 
    class="fixed inset-0 z-[9999] flex justify-end"
    x-transition.opacity
    >
    <div 
        x-transition:enter="transform transition ease-in-out duration-300"
        x-transition:enter-start="translate-x-full opacity-0"
        x-transition:enter-end="translate-x-0 opacity-100"
        x-transition:leave="transform transition ease-in-out duration-200"
        x-transition:leave-start="translate-x-0 opacity-100"
        x-transition:leave-end="translate-x-full opacity-0"
        class="bg-white w-full max-w-2xl h-full overflow-y-auto"
    >
        <!-- Header -->
        <div class="flex justify-between items-center border-b px-6 py-4 sticky top-0 bg-white z-10">
        <h2 class="text-base font-semibold flex items-center gap-2">
            <i data-lucide="file-text" class="w-5 h-5 text-primary-600"></i>
            Upload Documents
        </h2>
        <button @click.stop="openDocPanel = false" class="text-slate-500 hover:text-red-600">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
        </div>

        <!-- Upload Form -->
        <form 
        class="p-6 space-y-4 text-sm"
        @submit.prevent="uploadedDocs.push({ name: tags.join(', '), file: docFile }); tags=[]; docFile=null; openDocPanel=false"
        x-data="{
            docFile: null,
            tags: [],
            inputValue: '',
            handleKey(e) {
            const key = e.key;
            if (key === ' ' || key === ',' || key === 'Enter') {
                e.preventDefault();
                const val = this.inputValue.trim().replace(/,+$/, '');
                if (val && !this.tags.includes(val.toLowerCase())) {
                this.tags.push(val.toLowerCase());
                }
                this.inputValue = '';
            }
            },
            removeTag(tag) {
            this.tags = this.tags.filter(t => t !== tag);
            }
        }"
        >
        <!-- Document Tags -->
        <div>
            <label class="block text-xs font-medium text-slate-700">Document Tags</label>
            <div class="mt-1 border border-slate-300 rounded-md p-2 flex flex-wrap items-center gap-2">
            
            <!-- Tags -->
            <template x-for="(tag, index) in tags" :key="index">
                <div class="flex items-center bg-primary-50 text-primary-700 text-xs font-medium px-2 py-1 rounded-full border border-primary-200">
                <span x-text="tag"></span>
                <button 
                    type="button" 
                    @click.stop="removeTag(tag)" 
                    class="ml-1 text-slate-500 hover:text-red-500"
                >
                    <svg xmlns='http://www.w3.org/2000/svg' class='w-3 h-3' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
                    <line x1='18' y1='6' x2='6' y2='18'></line>
                    <line x1='6' y1='6' x2='18' y2='18'></line>
                    </svg>
                </button>
                </div>
            </template>

            <!-- Input -->
            <input 
                type="text"
                x-model="inputValue"
                @keydown="handleKey($event)"
                placeholder="Type and press space or comma"
                class="flex-1 border-none outline-none text-sm px-1 py-0.5"
            >
            </div>
        </div>

        <!-- Upload Box -->
        <div>
            <label class="block text-xs font-medium text-slate-700">Property Document *</label>
            <div 
            class="mt-1 border-2 border-dashed border-slate-300 rounded-lg p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-50 transition"
            @click="$refs.docInput.click()"
            >
            <i data-lucide="cloud-upload" class="w-8 h-8 text-slate-400 mb-1"></i>
            <p class="text-xs text-slate-500 text-center">Click to upload document</p>
            <p class="text-[11px] text-slate-400">PDF, DOC, JPG up to 10MB</p>
            <input 
                type="file" 
                class="hidden" 
                x-ref="docInput"
                @change="docFile = $event.target.files[0]?.name"
            >
            </div>
            <template x-if="docFile">
            <p class="mt-2 text-xs text-green-600">📄 <span x-text="docFile"></span> selected</p>
            </template>
        </div>

        <!-- Buttons -->
        <div class="flex justify-between items-center pt-4">
            <button 
            type="button" 
            @click.stop="openDocPanel = false" 
            class="px-4 py-1.5 border border-slate-300 rounded-md text-slate-700 text-sm hover:bg-slate-50"
            >
            Cancel
            </button>
            <button 
            type="submit" 
            class="px-4 py-1.5 bg-primary-600 text-white text-sm rounded-md hover:bg-primary-700"
            >
            Upload
            </button>
        </div>
        </form>
    </div>
    </div>



</div>
